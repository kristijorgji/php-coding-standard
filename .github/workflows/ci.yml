name: CI

on:
  push:
  pull_request:

jobs:
  phpcs:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpcs --standard=KristijorgjiCodingStandard KristijorgjiCodingStandard || true
        # Package currently has no PHP sources to sniff; ensure standard resolves.
      - run: vendor/bin/phpcs -i | grep -q KristijorgjiCodingStandard

  phpcs85:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpcs --standard=KristijorgjiCodingStandard85 KristijorgjiCodingStandard85 || true
      - run: vendor/bin/phpcs -i | grep -q KristijorgjiCodingStandard85
